<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Let's play Agda — editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <!-- Which service worker makes this page cross-origin isolated (see bootstrap.js) -->
  <meta name="lpa-sw" content="__SW_URL__" data-scope="__SW_SCOPE__">

  <!-- Read by the VS Code workbench (same elements the official web page template has) -->
  <meta id="vscode-workbench-builtin-extensions" data-settings="[]">
  <link rel="icon" href="vscode/favicon.ico" type="image/x-icon">
  <link data-name="vs/workbench/workbench.web.main" rel="stylesheet" href="vscode/out/vs/workbench/workbench.web.main.internal.css">
  <style id="vscode-css-modules" type="text/css" media="screen"></style>
  <script>
    // match the loading screen to the page that embeds the editor. No `color-scheme: dark`
    // here: the webviews (Agda's panel) are iframes with a page of `normal` scheme, and a
    // browser paints an opaque white backdrop behind an iframe whose scheme differs from its parent's.
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.documentElement.style.background = '#1f1f1f';
    }
  </script>
  <style>
    /* overscroll-behavior: a drag that the editor does not use must not move the page around this frame (Safari on iOS) */
    html, body { height: 100%; margin: 0; overscroll-behavior: none; }
    #lpa-status { font: 16px/1.5 system-ui, sans-serif; padding: 2rem; color: #888; }
    #lpa-status.error { color: #b00020; white-space: pre-wrap; }
    /* iOS zooms the page in when an input with a font below 16px gets the focus, and the text input of the editor (the
       hidden textarea of Monaco, in the size of the editor's font) is one. -webkit-touch-callout exists on iOS only. */
    @supports (-webkit-touch-callout: none) {
      .monaco-editor textarea.inputarea { font-size: 16px !important; }
    }
  </style>
</head>
<body aria-label="">
  <div id="lpa-status">Loading the editor…</div>
  <noscript>This editor needs JavaScript.</noscript>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
